# Example: serve Callpath at https://callpath.example.com/code/.
# Replace the domain and certificate paths before enabling this virtual host.
# Backend: PUBLIC_ORIGIN=https://callpath.example.com and BASE_PATH=/code.
server {
    listen 80;
    listen [::]:80;
    server_name callpath.example.com;
    return 301 https://callpath.example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name callpath.example.com;
    ssl_certificate /etc/letsencrypt/live/callpath.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/callpath.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /code {
        return 308 /code/;
    }
    location ^~ /code/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        client_max_body_size 21m;
    }
    location / {
        return 404;
    }
}
